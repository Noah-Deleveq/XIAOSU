[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dingtalk-stream>=0.24.3",
    "fastmcp[server]>=2.12.0",
    "fastapi>=0.141.1",
    "jieba>=0.42.1",
    "openai>=2.54.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.1",
    "lark-oapi>=1.7.2",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

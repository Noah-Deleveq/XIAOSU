services:
  - type: web
    name: xiaosu
    runtime: docker
    repo: https://github.com/Noah-Deleveq/XIAOSU
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: deepseek
      - key: DINGTALK_BOT_ENABLED
        value: "true"
      - key: FEISHU_BOT_ENABLED
        value: "true"
      - key: AUTO_SEED_ON_START
        value: "true"
      - key: PYTHONIOENCODING
        value: utf-8
      - key: LANG
        value: C.UTF-8
      - key: LC_ALL
        value: C.UTF-8
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DINGTALK_APP_KEY
        sync: false
      - key: DINGTALK_APP_SECRET
        sync: false
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
